name: Build APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: '3.11' # 明确指定构建所用的 Python 版本
          bundled-python-version: '3.11' # 明确指定打包进 App 的 Python 版本

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArchiveApp-APK
          path: ${{ steps.build.outputs.archive-path }}
