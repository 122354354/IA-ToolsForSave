name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 允许你在网页上手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 使用 Flet 官方自动化工具，它会自动处理环境
      - name: Build APK
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk

      # 下载构建好的 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArchiveApp-APK
          path: ${{ steps.build.outputs.archive-path }} 
